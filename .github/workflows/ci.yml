name: Prep Academy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-critical-tests:
    name: Backend critical tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run critical regression tests
        run: |
          python -m pytest \
            tests/test_admin_endpoint_access_control.py \
            tests/test_dicom_access_control.py \
            tests/test_unified_rag_boundaries.py \
            tests/test_extraction_benchmark.py \
            tests/test_obsidian_rag_benchmark.py \
            -q

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://prep-academy.onrender.com"
          REACT_APP_ADVANCED: "false"
        run: npm run build
