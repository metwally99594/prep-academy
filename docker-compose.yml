version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: prep-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: prepacademy
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: prep-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prep-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: prepacademy
      ENABLE_ADVANCED_FEATURES: "true"
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

volumes:
  mongo_data:
  qdrant_data:
